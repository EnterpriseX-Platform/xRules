# xRules on kt1-qa · https://xrules.oneweb.tech (Studio at /, API at /xrules-api/)
# Same pattern as FactoryX/MaintainX: ingress nginx + cert-manager letsencrypt-prod, storage nfs-openedx, images docker.io/avalantoneweb.
# Images are set by Jenkins (FactoryX/xrules). Secret xrules-secret is created by the first Jenkins run — never committed.
apiVersion: v1
kind: Namespace
metadata: { name: xrules }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: xrules-postgres-pvc, namespace: xrules, labels: { app: xrules-postgres } }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-openedx
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: xrules-postgres, namespace: xrules, labels: { app: xrules-postgres } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: xrules-postgres } }
  template:
    metadata: { labels: { app: xrules-postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: xrulesdb }
            - { name: POSTGRES_USER, value: xrules }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: xrules-secret, key: POSTGRES_PASSWORD } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: TZ, value: Asia/Bangkok }
          readinessProbe: { exec: { command: [pg_isready, -U, xrules, -d, xrulesdb] }, periodSeconds: 10 }
          resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 2Gi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: xrules-postgres-pvc } }]
---
apiVersion: v1
kind: Service
metadata: { name: xrules-postgres-svc, namespace: xrules }
spec: { selector: { app: xrules-postgres }, ports: [{ port: 5432, targetPort: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: xrules-api, namespace: xrules, labels: { app: xrules-api } }
spec:
  replicas: 1
  selector: { matchLabels: { app: xrules-api } }
  template:
    metadata: { labels: { app: xrules-api } }
    spec:
      containers:
        - name: xrules-api
          image: docker.io/avalantoneweb/xrules-api:placeholder
          ports: [{ containerPort: 4000 }]
          envFrom: [{ secretRef: { name: xrules-secret } }]
          env:
            - { name: PORT, value: "4000" }
            - { name: XRULES_ENV, value: QA }
            - { name: ENGINE_HUB_URL, value: "http://xrules-engine-svc:50051" }
            - { name: XRULES_ML_URL, value: "http://xrules-ml-svc:4600" }
          readinessProbe: { httpGet: { path: /health, port: 4000 }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 4000 }, initialDelaySeconds: 60, periodSeconds: 20 }
          resources: { requests: { cpu: 200m, memory: 384Mi }, limits: { cpu: "1", memory: 1536Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: xrules-api-svc, namespace: xrules }
spec: { selector: { app: xrules-api }, ports: [{ port: 4000, targetPort: 4000 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: xrules-web, namespace: xrules, labels: { app: xrules-web } }
spec:
  replicas: 1
  selector: { matchLabels: { app: xrules-web } }
  template:
    metadata: { labels: { app: xrules-web } }
    spec:
      containers:
        - name: xrules-web
          image: docker.io/avalantoneweb/xrules-web:placeholder
          ports: [{ containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /login, port: 3000 }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: 500m, memory: 768Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: xrules-web-svc, namespace: xrules }
spec: { selector: { app: xrules-web }, ports: [{ port: 3000, targetPort: 3000 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: xrules-engine, namespace: xrules, labels: { app: xrules-engine } }
spec:
  replicas: 1
  selector: { matchLabels: { app: xrules-engine } }
  template:
    metadata: { labels: { app: xrules-engine } }
    spec:
      containers:
        - name: xrules-engine
          image: docker.io/avalantoneweb/xrules-engine:placeholder
          ports: [{ containerPort: 50051 }, { containerPort: 50060 }]
          env:
            - { name: BACKEND_URL, value: "http://xrules-api-svc:4000" }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: xrules-secret, key: JWT_SECRET } } }
            - { name: JWT_REFRESH_SECRET, valueFrom: { secretKeyRef: { name: xrules-secret, key: JWT_REFRESH_SECRET } } }
          readinessProbe: { httpGet: { path: /api/v1/health, port: 50051 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/v1/health, port: 50051 }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: xrules-engine-svc, namespace: xrules }
spec: { selector: { app: xrules-engine }, ports: [{ name: http, port: 50051, targetPort: 50051 }, { name: grpc, port: 50060, targetPort: 50060 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: xrules-ml, namespace: xrules, labels: { app: xrules-ml } }
spec:
  replicas: 1
  selector: { matchLabels: { app: xrules-ml } }
  template:
    metadata: { labels: { app: xrules-ml } }
    spec:
      containers:
        - name: xrules-ml
          image: docker.io/avalantoneweb/xrules-ml:placeholder
          ports: [{ containerPort: 4600 }]
          readinessProbe: { httpGet: { path: /health, port: 4600 }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 4600 }, initialDelaySeconds: 40, periodSeconds: 20 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "2", memory: 3Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: xrules-ml-svc, namespace: xrules }
spec: { selector: { app: xrules-ml }, ports: [{ port: 4600, targetPort: 4600 }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xrules-web
  namespace: xrules
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
spec:
  ingressClassName: nginx
  tls: [{ hosts: [xrules.oneweb.tech], secretName: xrules-tls }]
  rules:
    - host: xrules.oneweb.tech
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: xrules-web-svc, port: { number: 3000 } } } }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xrules-api
  namespace: xrules
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  tls: [{ hosts: [xrules.oneweb.tech], secretName: xrules-tls }]
  rules:
    - host: xrules.oneweb.tech
      http: { paths: [{ path: /xrules-api(/|$)(.*), pathType: ImplementationSpecific, backend: { service: { name: xrules-api-svc, port: { number: 4000 } } } }] }
