apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-studio
  labels: {{- include "xrules.labels" . | nindent 4 }}
spec:
  type: {{ .Values.studio.service.type }}
  ports: [{ port: {{ .Values.studio.service.port }}, targetPort: 3000, name: http }]
  selector:
    {{- include "xrules.selector" (merge (dict "component" "studio") .) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-studio
  labels: {{- include "xrules.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.studio.replicas }}
  selector:
    matchLabels:
      {{- include "xrules.selector" (merge (dict "component" "studio") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "xrules.selector" (merge (dict "component" "studio") .) | nindent 8 }}
    spec:
      containers:
        - name: studio
          image: "{{ .Values.studio.image.repository }}:{{ include "xrules.imageTag" (dict "Chart" .Chart "tag" .Values.studio.image.tag) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{ containerPort: 3000, name: http }]
          env:
            - { name: NEXT_PUBLIC_BACKEND_URL, value: "http://{{ .Release.Name }}-backend:{{ .Values.backend.service.port }}" }
            - { name: NODE_ENV, value: "production" }
          resources: {{- toYaml .Values.studio.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 15
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-studio
  labels: {{- include "xrules.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-studio
                port:
                  number: {{ .Values.studio.service.port }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
{{- end }}
