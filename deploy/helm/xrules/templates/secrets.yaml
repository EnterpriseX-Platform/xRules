apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "xrules.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET:           {{ required "jwt.secret is required" .Values.jwt.secret | quote }}
  CONNECTION_ENC_KEY:   {{ required "encryption.connectionKey is required" .Values.encryption.connectionKey | quote }}
  POSTGRES_PASSWORD:    {{ required "postgres.password is required" .Values.postgres.password | quote }}
  {{- if .Values.llm.openaiKey }}
  OPENAI_API_KEY:       {{ .Values.llm.openaiKey | quote }}
  {{- end }}
  {{- if .Values.llm.anthropicKey }}
  ANTHROPIC_API_KEY:    {{ .Values.llm.anthropicKey | quote }}
  {{- end }}
