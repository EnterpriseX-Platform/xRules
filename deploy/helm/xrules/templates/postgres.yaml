{{- if .Values.postgres.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "xrules.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports: [{ port: 5432, targetPort: 5432, name: postgres }]
  selector:
    {{- include "xrules.selector" (merge (dict "component" "postgres") .) | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "xrules.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "xrules.selector" (merge (dict "component" "postgres") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "xrules.selector" (merge (dict "component" "postgres") .) | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER,     value: {{ .Values.postgres.user     | quote }} }
            - { name: POSTGRES_DB,       value: {{ .Values.postgres.database | quote }} }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-secrets, key: POSTGRES_PASSWORD } } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}] }
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.postgres.persistence.size }} } }
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass }}
        {{- end }}
{{- end }}
