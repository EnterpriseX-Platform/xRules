[package]
name = "xrules-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["XRULES Team"]
description = "High-performance execution engine for rules/flows"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["codec", "time"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# HTTP/gRPC
axum = { version = "0.7", features = ["ws", "http2"] }
tonic = "0.11"
tonic-types = "0.11"
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tonic-reflection = "0.11"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate"] }

# Redis
fred = { version = "9.0", features = ["replicas"] }

# Kafka
rdkafka = { version = "0.36", features = ["tokio", "tracing", "ssl-vendored"], optional = true }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
tracing-appender = "0.2"

# Configuration
config = "0.14"
dotenvy = "0.15"

# Utilities
uuid = { version = "1.7", features = ["v4", "serde", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"
hashbrown = "0.14"
dashmap = "5.5"
parking_lot = "0.12"
num_cpus = "1.16"

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream", "multipart"] }

# gRPC protobuf
prost = "0.12"
prost-types = "0.12"

# Expression evaluation
eval = "0.4"
jsonpath-rust = "0.5"

# Template engine
handlebars = "5.1"

# Cryptography
hmac = "0.12"
sha2 = "0.10"
base64 = "0.21"
ring = "0.17"
hex = "0.4"
subtle = "2.5"
rand = "0.8"

# Scheduling
cron = "0.12"

# Validation
validator = { version = "0.16", features = ["derive"] }

# Metrics
metrics = "0.22"
metrics-exporter-prometheus = "0.13"

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"

[features]
default = ["kafka"]
kafka = ["dep:rdkafka"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = true
opt-level = 1
