version: '3.8'

services:
  xrules-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xrules-engine
    ports:
      - "50051:50051"
      - "9090:9090"
    environment:
      - ENGINE_HOST=0.0.0.0
      - ENGINE_PORT=50051
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/xrules
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - LOG_LEVEL=info
      - RUST_LOG=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - xrules-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: xrules-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=xrules
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - xrules-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: xrules-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - xrules-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: xrules-kafka
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    networks:
      - xrules-network
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: xrules-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - xrules-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: xrules-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - xrules-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: xrules-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - xrules-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  prometheus_data:

networks:
  xrules-network:
    driver: bridge
