version: '3.9'

# ==========================================
# XRULES Development Environment
# Pre-built images with hot reload support
# ==========================================

services:
  # ==========================================
  # Infrastructure
  # ==========================================
  
  postgres:
    image: postgres:16-alpine
    container_name: xrules-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xrules}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xrules_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-xrules}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xrules}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - xrules-dev-network

  redis:
    image: redis:7-alpine
    container_name: xrules-redis-dev
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev_secret}
    volumes:
      - redis_dev_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - xrules-dev-network

  # ==========================================
  # XRules Engine (Rust)
  # ==========================================
  
  xrules-engine:
    build:
      context: ./xrules-engine
      dockerfile: Dockerfile.dev
    container_name: xrules-engine-dev
    restart: unless-stopped
    environment:
      - RUST_LOG=debug
      - RUST_BACKTRACE=1
      - DATABASE_URL=postgres://${POSTGRES_USER:-xrules}:${POSTGRES_PASSWORD:-xrules_dev_secret}@postgres:5432/xrules_engine
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_dev_secret}@redis:6379
      - GRPC_PORT=50051
      - METRICS_PORT=9090
      - ENABLE_CACHING=true
      - MAX_WORKERS=4
    volumes:
      - ./xrules-engine/src:/app/src:cached
      - ./xrules-engine/proto:/app/proto:cached
      - engine_target_cache:/app/target
    ports:
      - "50051:50051"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xrules-dev-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # XRules API (Go)
  # ==========================================
  
  xrules-api:
    build:
      context: ./xrules-api
      dockerfile: Dockerfile.dev
    container_name: xrules-api-dev
    restart: unless-stopped
    environment:
      - ENV=development
      - SERVER_PORT=8080
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-xrules}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-xrules_dev_secret}
      - DATABASE_NAME=xrules_api
      - DATABASE_SSL_MODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev_secret}
      - REDIS_DB=0
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-in-production}
      - JWT_EXPIRATION=24h
      - ENGINE_GRPC_ADDR=xrules-engine:50051
      - CORS_ORIGIN=http://localhost:3000
      - LOG_LEVEL=debug
    volumes:
      - ./xrules-api:/app:cached
      - go_mod_cache:/go/pkg/mod
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      xrules-engine:
        condition: service_healthy
    networks:
      - xrules-dev-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==========================================
  # XRules Studio (Next.js)
  # ==========================================
  
  xrules-studio:
    build:
      context: ./xrules-studio
      dockerfile: Dockerfile.dev
    container_name: xrules-studio-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
    volumes:
      - ./xrules-studio:/app:cached
      - /app/node_modules
      - /app/.next
    ports:
      - "3002:3000"
    depends_on:
      - xrules-api
    networks:
      - xrules-dev-network
    stdin_open: true
    tty: true

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  engine_target_cache:
    driver: local
  go_mod_cache:
    driver: local

networks:
  xrules-dev-network:
    driver: bridge
    name: xrules-dev-network
