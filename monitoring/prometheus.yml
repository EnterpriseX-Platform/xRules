global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'xrules-engine'
    static_configs:
      - targets: ['xrules-engine:9090']
    metrics_path: /metrics

  - job_name: 'xrules-api'
    static_configs:
      - targets: ['xrules-api:8080']
    metrics_path: /metrics
