[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name            = "xrules"
version         = "0.1.0"
description     = "Official Python SDK for XRules — open-source decision management platform"
readme          = "README.md"
license         = { text = "AGPL-3.0" }
requires-python = ">=3.9"
authors         = [{ name = "XRules contributors" }]
keywords        = ["xrules", "decision-management", "rules-engine", "dmn", "scoring"]
classifiers     = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.24,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "mypy>=1.0",
]

[project.urls]
Homepage      = "https://github.com/your-org/xrules"
Documentation = "https://github.com/your-org/xrules/tree/main/sdks/python"
Source        = "https://github.com/your-org/xrules"
Issues        = "https://github.com/your-org/xrules/issues"

[tool.hatch.build.targets.wheel]
packages = ["xrules"]
