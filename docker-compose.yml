# ==========================================
# XRules Development - PostgreSQL Only
# ==========================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: xrules-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: xrules
      POSTGRES_PASSWORD: xrules_secret
      POSTGRES_DB: xrulesdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xrules"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
