apiVersion: v1
kind: Service
metadata:
  name: xrules-engine
  namespace: xrules
  labels:
    app.kubernetes.io/name: xrules-engine
    app.kubernetes.io/component: engine
    app.kubernetes.io/part-of: xrules-v2
spec:
  type: ClusterIP
  ports:
    - port: 50051
      targetPort: 50051
      protocol: TCP
      name: grpc
