apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrules-studio
  namespace: xrules
  labels:
    app.kubernetes.io/name: xrules-studio
    app.kubernetes.io/component: studio
    app.kubernetes.io/part-of: xrules-v2
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: xrules-studio
      app.kubernetes.io/component: studio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xrules-studio
        app.kubernetes.io/component: studio
        app.kubernetes.io/part-of: xrules-v2
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - xrules-studio
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q --spider http://xrules-api:8080/health/ready 2>/dev/null; do
                echo "Waiting for XRules API..."
                sleep 2
              done
              echo "XRules API is ready!"
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"
      containers:
        - name: xrules-studio
          image: xrules-studio:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: xrules-config
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: xrules-config
                  key: NODE_ENV
            - name: NEXT_PUBLIC_API_URL
              value: "http://xrules-api:8080"
            - name: PORT
              value: "3000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
