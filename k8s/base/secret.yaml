apiVersion: v1
kind: Secret
metadata:
  name: xrules-secrets
  namespace: xrules
  labels:
    app.kubernetes.io/name: xrules
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # ==========================================
  # Database Credentials
  # ==========================================
  DATABASE_USER: "xrules"
  DATABASE_PASSWORD: "xrules_secret"
  DATABASE_URL: "postgres://xrules:xrules_secret@postgres:5432/xrules?sslmode=prefer"
  
  # ==========================================
  # Redis Credentials
  # ==========================================
  REDIS_PASSWORD: "redis_secret"
  REDIS_URL: "redis://:redis_secret@redis:6379/0"
  
  # ==========================================
  # JWT Secrets
  # ==========================================
  JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
  JWT_REFRESH_SECRET: "your-super-secret-refresh-key-change-in-production"
  
  # ==========================================
  # OAuth Credentials (optional)
  # ==========================================
  OAUTH_GOOGLE_CLIENT_ID: ""
  OAUTH_GOOGLE_CLIENT_SECRET: ""
  OAUTH_GITHUB_CLIENT_ID: ""
  OAUTH_GITHUB_CLIENT_SECRET: ""
  OAUTH_MICROSOFT_CLIENT_ID: ""
  OAUTH_MICROSOFT_CLIENT_SECRET: ""
  
  # ==========================================
  # API Keys
  # ==========================================
  INTERNAL_API_KEY: "internal-api-key-change-me"
  WEBHOOK_SECRET: "webhook-secret-change-me"
  
  # ==========================================
  # Encryption Keys
  # ==========================================
  ENCRYPTION_KEY: "your-32-byte-encryption-key!"
  CONNECTION_ENCRYPTION_KEY: "conn-encryption-key-32-bytes!"
  
  # ==========================================
  # SMTP Configuration (optional)
  # ==========================================
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  
  # ==========================================
  # External Service Keys
  # ==========================================
  # Add any external service API keys here
