apiVersion: v1
kind: ConfigMap
metadata:
  name: xrules-config
  namespace: xrules
  labels:
    app.kubernetes.io/name: xrules
    app.kubernetes.io/component: config
data:
  # ==========================================
  # Environment Configuration
  # ==========================================
  ENV: "production"
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  
  # ==========================================
  # Database Configuration
  # ==========================================
  DATABASE_HOST: "postgres"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "xrules"
  DATABASE_SSL_MODE: "prefer"
  DATABASE_POOL_MIN: "5"
  DATABASE_POOL_MAX: "20"
  
  # ==========================================
  # Redis Configuration
  # ==========================================
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  
  # ==========================================
  # Service Ports
  # ==========================================
  XRULES_ENGINE_GRPC_PORT: "50051"
  XRULES_ENGINE_METRICS_PORT: "9090"
  XRULES_API_PORT: "8080"
  XRULES_STUDIO_PORT: "3000"
  
  # ==========================================
  # Engine Configuration
  # ==========================================
  RUST_LOG: "info"
  ENGINE_ENABLE_CACHING: "true"
  ENGINE_MAX_WORKERS: "10"
  ENGINE_QUEUE_SIZE: "1000"
  ENGINE_EXECUTION_TIMEOUT: "300"
  
  # ==========================================
  # API Configuration
  # ==========================================
  API_CORS_ORIGIN: "*"
  API_RATE_LIMIT_WINDOW_MS: "900000"
  API_RATE_LIMIT_MAX_REQUESTS: "100"
  API_REQUEST_TIMEOUT: "30000"
  
  # ==========================================
  # JWT Configuration
  # ==========================================
  JWT_EXPIRATION: "24h"
  JWT_REFRESH_EXPIRATION: "7d"
  JWT_ISSUER: "xrules-api"
  
  # ==========================================
  # Feature Flags
  # ==========================================
  FEATURE_ENABLE_REALTIME: "true"
  FEATURE_ENABLE_AUDIT_LOG: "true"
  FEATURE_ENABLE_SCHEDULER: "true"
  FEATURE_ENABLE_WEBHOOKS: "true"
  FEATURE_ENABLE_CUSTOM_NODES: "true"
  FEATURE_ENABLE_EXPORT_IMPORT: "true"
  
  # ==========================================
  # Studio Configuration
  # ==========================================
  STUDIO_API_URL: "http://xrules-api:8080"
  STUDIO_WS_URL: "ws://xrules-api:8080"
  
  # ==========================================
  # Observability
  # ==========================================
  METRICS_ENABLED: "true"
  TRACING_ENABLED: "true"
  HEALTH_CHECK_INTERVAL: "30"
