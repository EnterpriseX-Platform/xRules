apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: xrules
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: xrules-v2
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
