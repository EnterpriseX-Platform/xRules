apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrules-engine
  namespace: xrules-production
spec:
  template:
    spec:
      containers:
        - name: xrules-engine
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrules-api
  namespace: xrules-production
spec:
  template:
    spec:
      containers:
        - name: xrules-api
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrules-studio
  namespace: xrules-production
spec:
  template:
    spec:
      containers:
        - name: xrules-studio
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
