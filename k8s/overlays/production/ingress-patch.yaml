# Additional production ingress configuration
# Includes WAF rules and enhanced security headers

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xrules-api-v1
  namespace: xrules-production
  labels:
    app.kubernetes.io/name: xrules-api
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: xrules-v2
    version: v1
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://xrules.io, https://studio.xrules.io"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # WAF annotations (if using nginx-modsecurity)
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.xrules.io
      secretName: prod-xrules-api-tls-v1
  rules:
    - host: api.xrules.io
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: prod-xrules-api
                port:
                  number: 8080
