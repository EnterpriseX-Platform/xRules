apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: xrules-engine-pdb
  namespace: xrules-production
  labels:
    app.kubernetes.io/name: xrules-engine
    app.kubernetes.io/component: pdb
    app.kubernetes.io/part-of: xrules-v2
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: xrules-engine
      app.kubernetes.io/component: engine
