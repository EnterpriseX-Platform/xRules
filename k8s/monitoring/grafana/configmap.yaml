apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: xrules
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
data:
  grafana.ini: |
    [paths]
    data = /var/lib/grafana/data
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning

    [server]
    protocol = http
    http_port = 3000
    domain = grafana.xrules.local
    root_url = %(protocol)s://%(domain)s/
    serve_from_sub_path = false

    [analytics]
    reporting_enabled = false
    check_for_updates = true

    [security]
    admin_user = admin
    admin_password = admin
    disable_gravatar = true
    cookie_secure = true
    cookie_samesite = strict
    strict_transport_security = true
    strict_transport_security_max_age_seconds = 86400
    strict_transport_security_preload = true
    x_content_type_options = true
    x_xss_protection = true

    [users]
    allow_sign_up = false
    auto_assign_org = true
    auto_assign_org_role = Viewer

    [auth]
    disable_login_form = false
    disable_signout_menu = false

    [auth.anonymous]
    enabled = false

    [log]
    mode = console
    level = info

    [metrics]
    enabled = true
    interval_seconds = 10

    [alerting]
    enabled = true
    execute_alerts = true

    [unified_alerting]
    enabled = true

    [feature_toggles]
    publicDashboards = true

  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: "5s"
          httpMethod: POST
          manageAlerts: true
          prometheusType: Prometheus
          prometheusVersion: "2.48.0"
          cacheLevel: 'High'
          incrementalQuerying: true

      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        editable: false
        jsonData:
          maxLines: 1000
          derivedFields:
            - name: TraceID
              matcherRegex: '"trace_id":"(\w+)"'
              url: '$${__value.raw}'

  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards

  # Sample XRules Dashboard
  xrules-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "XRules Platform Overview",
        "tags": ["xrules", "overview"],
        "timezone": "browser",
        "schemaVersion": 36,
        "refresh": "5s",
        "panels": [
          {
            "id": 1,
            "title": "Engine Requests/sec",
            "type": "stat",
            "targets": [
              {
                "expr": "rate(xrules_engine_requests_total[5m])",
                "legendFormat": "{{method}}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "API Response Time",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(xrules_api_request_duration_seconds_bucket[5m]))",
                "legendFormat": "p95"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "Pod CPU Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(container_cpu_usage_seconds_total{namespace=\"xrules\"}[5m])",
                "legendFormat": "{{pod}}"
              }
            ],
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8}
          }
        ]
      }
    }
