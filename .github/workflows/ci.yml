name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- TypeScript: backend + studio ----------
  typescript:
    name: TypeScript (backend + studio)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xrules
          POSTGRES_PASSWORD: xrules_secret
          POSTGRES_DB: xrulesdb
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://xrules:xrules_secret@localhost:5432/xrulesdb
      JWT_SECRET: ci-jwt-secret-must-be-32-characters-long
      CONNECTION_ENC_KEY: ci-conn-key-must-be-32-characters-long
      ENGINE_HUB_URL: http://localhost:50051
      NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm install
      - name: Backend — Prisma generate
        working-directory: apps/xrules-backend
        run: npx prisma generate
      - name: Backend — Prisma push
        working-directory: apps/xrules-backend
        run: npx prisma db push
      - name: Backend — Type check
        working-directory: apps/xrules-backend
        run: npx tsc --noEmit
      - name: Studio — Type check
        working-directory: apps/xrules-studio
        run: npx tsc --noEmit
      - name: Studio — Lint
        working-directory: apps/xrules-studio
        run: npm run lint
      - name: Studio — Build
        working-directory: apps/xrules-studio
        run: npm run build

  # ---------- Rust engine ----------
  rust:
    name: Rust engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/xrules-engine
      - name: Format
        working-directory: apps/xrules-engine
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: apps/xrules-engine
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true   # warn-only until existing warnings cleaned up
      - name: Test
        working-directory: apps/xrules-engine
        run: cargo test --all

  # ---------- Docker images ----------
  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [typescript, rust]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/backend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: xrules-backend:ci
      - name: Build studio image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/studio.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: xrules-studio:ci
      - name: Build engine image
        uses: docker/build-push-action@v5
        with:
          context: apps/xrules-engine
          file: deploy/docker/engine.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: xrules-engine:ci
