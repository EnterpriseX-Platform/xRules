version: '3.8'

services:
  ai-engine:
    build: .
    container_name: xrules-ai-engine
    ports:
      - "50055:50055"
    environment:
      - PORT=50055
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/app/models:ro
      - ai-uploads:/app/uploads
    networks:
      - xrules-network
    # Uncomment for GPU support (requires nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:50055/health'); exit(0 if r.status_code == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  xrules-network:
    external: true
    name: xrules_default

volumes:
  ai-uploads:
    driver: local
