[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xrules-ai-engine"
version = "0.1.0"
description = "XRules AI Engine - Deep Learning model server (TensorFlow, PyTorch, ONNX)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.16.0",
    "Pillow>=10.0.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
tensorflow = ["tensorflow>=2.14.0"]
torch = ["torch>=2.1.0", "torchvision>=0.16.0"]
gpu = ["tensorflow[and-cuda]", "torch", "torchvision"]
dev = [
    "pytest>=7.4.0",
    "black>=23.9.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
