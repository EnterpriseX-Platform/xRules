[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xrules-llm-engine"
version = "0.1.0"
description = "XRules LLM Engine - Large Language Model integration server"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "openai>=1.3.0",
    "tiktoken>=0.5.0",
    "python-multipart>=0.0.6",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
ollama = ["ollama>=0.1.0"]
anthropic = ["anthropic>=0.8.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.9.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py39']
